name: Build WebDriverAgent IPA

on:
  release:
    types: [published]

env:
  HOST: macos-15
  XCODE_VERSION: 16.4

permissions:
  contents: write

jobs:
  for_real_devices:
    runs-on: macos-15
    name: Build WebDriverAgent for real iOS devices

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "${{ env.XCODE_VERSION }}"
      - name: Build WebDriverAgentRunner-Runner.app for iOS
        run: |
          echo "Starting build process..."

          # Clean and build for testing
          xcodebuild clean build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -derivedDataPath ${{ env.DERIVED_DATA_PATH }} \
            -scheme ${{ env.SCHEME }} \
            -destination "${{ env.DESTINATION }}" \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64

          echo "Build completed."

          # Navigate to derived data directory
          pushd ${{ env.WD }}

          # Same exclusion as Scripts/ci/build-real.sh: XCTest dependencies must resolve
          # from the device's developer support libraries, not the copies bundled by Xcode.
          # WebDriverAgentLib.framework lives in PlugIns/*.xctest/Frameworks and is kept.
          echo "Removing bundled XCTest frameworks..."
          rm -rf ${{ env.SCHEME }}-Runner.app/Frameworks/*

          echo "Creating IPA archive..."
          mkdir Payload
          cp -r ${{ env.SCHEME }}-Runner.app Payload
          zip -r WebDriverAgent.ipa Payload
          popd

          echo "Moving files to workspace root..."
          mv ${{ env.WD }}/WebDriverAgent.ipa ./

        env:
          DERIVED_DATA_PATH: appium_wda_ios
          SCHEME: WebDriverAgentRunner
          DESTINATION: generic/platform=iOS
          WD: appium_wda_ios/Build/Products/Debug-iphoneos

      - name: Upload IPA
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: WebDriverAgent.ipa
          asset_name: WebDriverAgent.ipa
          tag: ${{ github.ref }}
          overwrite: true
